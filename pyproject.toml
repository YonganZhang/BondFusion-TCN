[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bondfusion-tcn"
version = "0.1.0"
description = "VDL envelope and logging-curve fusion for cement-bond classification"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT; third-party components retain their original licenses"}
authors = [{name = "Yongan Zhang et al."}]
dependencies = [
  "torch>=2.1,<3", "numpy>=1.24,<3", "pandas>=2,<4", "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2", "PyYAML>=6,<7", "optuna>=3,<6",
  "einops>=0.6,<1", "reformer-pytorch==1.4.4"
]

[tool.setuptools.packages.find]
where = ["_code"]
include = ["da_reformer*"]
namespaces = true

[tool.setuptools.package-data]
"da_reformer.vendor.tslib" = ["LICENSE", "VENDOR.md"]
